// Top-level build.gradle file

buildscript {
    ext {
        compileSdkVersion = 35
        minSdkVersion = 23
        targetSdkVersion = 35

        androidxAppCompatVersion = "1.7.0"
        androidxCoordinatorLayoutVersion = "1.2.0"
        coreSplashScreenVersion = "1.0.1"
        junitVersion = "4.13.2"
        androidxJunitVersion = "1.1.5"
        androidxEspressoCoreVersion = "3.5.1"

        kotlin_version = "1.8.22"
        javaVersion = JavaVersion.VERSION_17
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.1.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:4.3.15" // if using Firebase
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Optional: apply compileOptions for all android projects
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty("android")) {
                android {
                    compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }
                    // Apply kotlinOptions only if supported (avoids LibraryExtension error)
                    if (project.android.hasProperty("kotlinOptions")) {
                        kotlinOptions {
                            jvmTarget = "17"
                        }
                    }
                }
            }
        }
    }
}

// Optional: task to clean all subprojects
task clean(type: Delete) {
    delete rootProject.buildDir
}
